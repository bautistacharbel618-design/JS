<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>TIENDITA</title>
    <style>
        dialog.dialog[open] { display: flex; flex-direction: column; max-height: 90vh; overflow: hidden; }
        dialog.dialog .dialog-header,
        dialog.dialog .dialog-footer { flex-shrink: 0; }
        dialog.dialog .dialog-body { flex: 1 1 auto; overflow-y: auto; }
        dialog.dialog .dialog-body h3 { font-size: 1rem; margin: .7rem 0 .25rem; }
        #preview { max-width: 100px; max-height: 100px; object-fit: cover; display: none; }
    </style>
</head>
<body>

    <nav class="navbar bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/cecy.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                TIENDITA
            </a>
        </div>
    </nav>

    <div class="pt-3 px-3">
        <button type="button" class="btn btn-primary" id="btnMenu" aria-label="Menú">
            <i class="bi bi-list"></i> Menú
        </button>
    </div>

    <div class="d-flex">
        <aside class="flex-shrink-0 p-3 border-end" id="sidebar" style="width: 220px;">
            <nav class="nav nav-pills flex-column">
                <a href="#" class="nav-link active" id="menuProductos" onclick="mostrarSeccion('seccionProductos', 'menuProductos'); return false;">
                    <i class="bi bi-box-seam"></i> Productos
                </a>
                <a href="#" class="nav-link" id="menuCategorias" onclick="mostrarSeccion('seccionCategorias', 'menuCategorias'); return false;">
                    <i class="bi bi-tags"></i> Categorías
                </a>
            </nav>
        </aside>
        <main class="flex-grow-1 p-3">

            <div class="p-4 bg-inverse card" id="seccionProductos">
                <h1 class="text-center fg-black">TIENDITA</h1>
                <hr>
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn-solid btn-styled theme-success" onclick="nuevoProducto()">
                        <i class="bi bi-plus-circle-fill"></i> Agregar
                    </button>
                </div>

                <table class="table table-striped table-hover mt-3">
                    <thead>
                        <tr class="text-center">
                            <th>IMAGEN</th>
                            <th>PRODUCTO</th>
                            <th>CATEGORIA</th>
                            <th>PRECIO</th>
                            <th>STOCK</th>
                            <th>ACCION</th>
                        </tr>
                    </thead>
                    <tbody id="productos"></tbody>
                </table>
            </div>

            <div class="p-4 bg-inverse card" id="seccionCategorias" style="display:none">
                <h1 class="text-center fg-black">CATEGORIAS</h1>
                <hr>
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn-solid btn-styled theme-success" onclick="nuevaCategoria()">
                        <i class="bi bi-plus-circle-fill"></i> Agregar
                    </button>
                </div>

                <table class="table table-striped table-hover mt-3">
                    <thead>
                        <tr class="text-center">
                            <th>CATEGORIA</th>
                            <th>ACCION</th>
                        </tr>
                    </thead>
                    <tbody id="categorias"></tbody>
                </table>
            </div>

        </main>
    </div>

    <dialog class="dialog" id="dlgProducto">
        <div class="dialog-header">
            <h1 class="dialog-title" id="tituloProducto">AGREGAR PRODUCTO</h1>
            <button type="button" class="btn-close" onclick="cerrarProducto()" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <input type="hidden" id="posicion">
            <h3>NOMBRE</h3>
            <input type="text" id="nombre" class="form-control">
            <h3>PRECIO</h3>
            <input type="number" step="0.01" min="0" id="precio" class="form-control">
            <h3>STOCK</h3>
            <input type="number" step="1" min="0" id="stock" class="form-control">
            <h3>CATEGORIA</h3>
            <select id="categoria" class="form-control"></select>
            <h3>IMAGEN</h3>
            <input type="file" id="imagen" accept="image/*" class="form-control">
            <img id="preview" class="mt-2" alt="Vista previa">
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-danger" onclick="cerrarProducto()">
                <i class="bi bi-x-circle"></i> Cancelar
            </button>
            <button type="button" class="btn-solid theme-success" id="btnSave">
                <i class="bi bi-check-circle"></i> Guardar
            </button>
        </div>
    </dialog>

    <dialog class="dialog" id="dlgCategoria">
        <div class="dialog-header">
            <h1 class="dialog-title" id="tituloCategoria">AGREGAR CATEGORIA</h1>
            <button type="button" class="btn-close" onclick="cerrarCategoria()" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <input type="hidden" id="posicionCat">
            <h3>NOMBRE</h3>
            <input type="text" id="nombreCat" class="form-control">
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-danger" onclick="cerrarCategoria()">
                <i class="bi bi-x-circle"></i> Cancelar
            </button>
            <button type="button" class="btn-solid theme-success" id="btnSaveCat">
                <i class="bi bi-check-circle"></i> Guardar
            </button>
        </div>
    </dialog>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/tiendita.js"></script>

</body>
</html>
