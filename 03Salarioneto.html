<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Salario Neto</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/appsalarioneto.js"></script>
</head>
<body onload="calcularSalarioNeto()">
<nav class="navbar bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="img/cecy.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
            PRACTICAS JAVASCRIPT
        </a>
    </div>
</nav>
    <div class="container text-center">
        <div class="display-2">Salario Neto</div>

        <table class="table">
            <tr>
                <td>Puesto</td>
                <td>Horas</td>
                <td>Años</td>
            </tr>
            <tr>
                <td>
                    <select id="puesto" class="form-control" onchange="calcularSalarioNeto()">
                        <option value="1">Gerente</option>
                        <option value="2">Secretaria</option>
                        <option value="3">Cajero</option>
                        <option value="4">Intendente</option>
                    </select>
                </td>
                <td>
                    <select id="horas" class="form-control" onchange="calcularSalarioNeto()">
                        <script>
                            for (var i = 0; i <= 50; i++) {
                                document.write("<option value='" + i + "'>" + i + "</option>");
                            }
                        </script>
                    </select>
                </td>
                <td>
                    <select id="anios" class="form-control" onchange="calcularSalarioNeto()">
                        <script>
                            for (var i = 0; i <= 40; i++) {
                                document.write("<option value='" + i + "'>" + i + "</option>");
                            }
                        </script>
                    </select>
                </td>
            </tr>
        </table>

        <table class="table">
            <tr>
                <td colspan="2"><h2>PERCEPCIONES</h2></td>
                <td colspan="2"><h2>DEDUCCIONES</h2></td>
            </tr>
            <tr>
                <td>Sueldo Base</td>
                <td><span id="sueldoBase"></span></td>
                <td>ISR</td>
                <td><span id="isr"></span></td>
            </tr>
            <tr>
                <td>Canasta Básica</td>
                <td><span id="canastaBasica"></span></td>
                <td>Servicio de Salud</td>
                <td><span id="servicioSalud"></span></td>
            </tr>
            <tr>
                <td>Apoyo</td>
                <td><span id="apoyo"></span></td>
                <td>AFORE</td>
                <td><span id="afore"></span></td>
            </tr>
            <tr>
                <td>Antigüedad</td>
                <td><span id="antiguedad"></span></td>
                <td>Sindicato</td>
                <td><span id="sindicato"></span></td>
            </tr>
            <tr>
                <td>Estímulo</td>
                <td><span id="estimulo"></span></td>
                <td>Caja de Ahorro</td>
                <td><span id="cajaAhorro"></span></td>
            </tr>
            <tr>
                <td>Bono de Puntualidad</td>
                <td><span id="bono"></span></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td colspan="2"><h4>TOTAL PERCEPCIONES</h4></td>
                <td colspan="2"><h4>TOTAL DEDUCCIONES</h4></td>
            </tr>
            <tr>
                <td colspan="2"><span id="totalPercepciones"></span></td>
                <td colspan="2"><span id="totalDeducciones"></span></td>
            </tr>
            <tr>
                <td colspan="4"><h2>SALARIO NETO</h2></td>
            </tr>
            <tr>
                <td colspan="4"><span id="salarioNeto"></span></td>
            </tr>
        </table>
    </div>

</body>
</html>
