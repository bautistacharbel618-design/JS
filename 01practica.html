<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>MI PRIMERA VEZ CON JAVASCRIPT</title>
</head>
<body>

<nav class="navbar bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="index.html">
      <img src="img/cecy.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
      PRACTICA 1 JAVASCRIPT
    </a>
  </div>
</nav>
    
<div class="container p-4">
  <h4 class="mb-4">Botones</h4>
  
  <div class="row justify-content-start gap-5">
      <div class="col-auto d-flex flex-column gap-3">
          <button class="btn" style="background-color: #8e44ad; color: white;" onclick="mensaje1()"><i class="bi bi-floppy mx-1"></i> Guardar</button>
          <button class="btn" style="border: 2px solid #ff7f50; color: #ff7f50; background-color: transparent;" onclick="mensaje2()"><i class="bi bi-trash mx-1"></i> Eliminar</button>
          <button class="btn rounded-pill" style="background-color: #2ecc71; color: white;" onclick="mensaje3()"><i class="bi bi-check-circle mx-1"></i> Aceptar</button>
          <button class="btn btn-lg" style="background-color: #f1c40f; color: black;" onclick="mensaje4()"><i class="bi bi-exclamation-triangle mx-1"></i> Alerta</button>
          <button class="btn btn-sm" style="background-color: #1abc9c; color: white;" onclick="mensaje5()"><i class="bi bi-info-square mx-1"></i> Info</button>
      </div>

      <div class="col-auto d-flex flex-column gap-3">
          <button class="btn shadow" style="background-color: #e84393; color: white;" onclick="mensaje6()"><i class="bi bi-gear mx-1"></i> Ajustes</button>
          <button class="btn" style="background-color: #2c3e50; color: white;" onclick="mensaje7()"><i class="bi bi-moon-stars mx-1"></i> Nocturno</button>
          <button class="btn" style="border: 2px dashed #c0392b; color: #c0392b; background-color: white;" onclick="mensaje8()"><i class="bi bi-envelope-paper mx-1"></i> Enviar</button>
          <button class="btn" style="background-color: #d35400; color: white;" onclick="mensaje9()"><i class="bi bi-person-circle mx-1"></i> Usuario</button>
          <button class="btn shadow-lg" style="background-color: #34495e; color: white;" onclick="mensaje10()"><i class="bi bi-power mx-1"></i> Apagar</button>
      </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  function mensaje1(){
    Swal.fire({ title: "¡Éxito!", text: "Se guardaron los datos.", icon: "success" });
  }

  function mensaje2(){
    Swal.fire({ title: "Error fatal", text: "No se pudo eliminar.", icon: "error" });
  }

  function mensaje3(){
    Swal.fire({ title: "Precaución", text: "Verifica antes de continuar.", icon: "warning" });
  }

  function mensaje4(){
    Swal.fire({ title: "Dato importante", text: "Mantenimiento programado.", icon: "info" });
  }

  function mensaje5(){
    Swal.fire({ title: "¿Dudas?", text: "¿Leer la documentación?", icon: "question" });
  }

  function mensaje6(){
    Swal.fire({
      title: "¡Configuración!",
      text: "Ajustes avanzados habilitados.",
      imageUrl: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=400&h=200&fit=crop",
      imageWidth: 400, imageHeight: 200, imageAlt: "Imagen"
    });
  }

  function mensaje7(){
    Swal.fire({
      toast: true, position: 'top-end', icon: 'success',
      title: 'Modo nocturno activado', showConfirmButton: false,
      timer: 3000, timerProgressBar: true
    });
  }

  function mensaje8(){
    let timerInterval;
    Swal.fire({
      title: 'Enviando...',
      html: 'Cerrando en <b></b> milisegundos.',
      timer: 2000, timerProgressBar: true,
      didOpen: () => {
        Swal.showLoading();
        const b = Swal.getHtmlContainer().querySelector('b');
        timerInterval = setInterval(() => { b.textContent = Swal.getTimerLeft(); }, 100);
      },
      willClose: () => { clearInterval(timerInterval); }
    });
  }

  function mensaje9(){
    Swal.fire({
      title: 'Tu nombre:', input: 'text',
      showCancelButton: true, confirmButtonText: 'Guardar', cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire(`¡Hola, ${result.value}!`, '', 'success');
      }
    });
  }

  function mensaje10(){
    Swal.fire({
      title: '¿Apagar sistema?', text: "Se perderán los cambios.",
      icon: 'warning', showCancelButton: true,
      confirmButtonColor: '#d33', cancelButtonColor: '#3085d6',
      confirmButtonText: 'Sí, apagar', cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire('¡Apagado!', 'El sistema se detuvo.', 'success');
      }
    });
  }
</script>
</body>
</html>
